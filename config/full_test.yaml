theory:
  class:
    external: true
    path: ../class_RGH_github
    precision: class
    extra_args:
      output: tCl,pCl,lCl,mPk
      l_max_scalars: 2000
      lensing: yes
      P_k_max_h/Mpc: 10.0
      background_verbose: 1
      cosmological_parameters_verbose: 1

params:
  omega_b: {prior: {min: 0.02, max: 0.024}, ref: 0.02237}
  omega_cdm: {prior: {min: 0.1, max: 0.14}, ref: 0.12}
  H0: {prior: {min: 65, max: 75}, ref: 67.4}
  ns: {prior: {min: 0.9, max: 1.1}, ref: 0.965}
  A_s: {prior: {min: 1e-9, max: 3e-9}, ref: 2.1e-9, latex: "A_s"}
  alpha_W: {prior: {min: -1e-2, max: 1e-2}, ref: 0.0, latex: "\\alpha_W"}
  m_theta: {prior: {min: 2, max: 4}, ref: 2, latex: "m_\\theta"}

likelihood:
  dummy_gaussian:
    mean: [0, 0]
    cov: [[1, 0], [0, 1]]

sampler:
  mcmc:
    max_samples: 300
    burn_in: 50
    proposal_scale: 2.5

output: outputs/chains/test_chain
